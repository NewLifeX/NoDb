name: aot

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  # 库侧 AOT/裁剪分析器（net8.0 IsAotCompatible，要求 0 告警）
  analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: AOT analyzer
      run: |
        set -o pipefail
        dotnet build NewLife.NoDb/NewLife.NoDb.csproj -f net8.0 -c Release 2>&1 | tee analyzer.log
        if grep -E "warning IL[0-9]+" analyzer.log; then
          echo "::error::存在 AOT/裁剪分析器告警，必须清零"
          exit 1
        fi

  # NativeAOT 冒烟矩阵：先 JIT 跑一遍作为对照，再 NativeAOT 发布运行（观察期，不阻塞主分支）
  smoke:
    name: smoke (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            bin: AotSmoke.exe
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotSmoke
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            bin: AotSmoke

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Install NativeAOT Prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT Baseline
      run: dotnet run -c Release --project AotSmoke/AotSmoke.csproj
    - name: Publish NativeAOT Smoke
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
    - name: Run NativeAOT Smoke
      shell: bash
      run: ./AotSmoke/bin/aot-out/${{ matrix.bin }}
